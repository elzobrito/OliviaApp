; Olivia Framework - php.ini de producao (OLIVIA-OPS-319)
; Carregado depois do php.ini-production oficial; sobrescreve o que importa
; para nao vazar versao nem erros na resposta HTTP.

expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

html_errors = Off
zend.exception_ignore_args = On
