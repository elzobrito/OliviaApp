name: Olivia Framework Quality Gate

on:
  push:
    branches: [master, feat/olivia-framework-php85-alpine]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olivia-framework-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP 8.5 kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint kernel, in-tree libs and app
        run: find lib src app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Kernel contract
        run: php tests/kernel/framework_contract_test.php

      - name: Security contract
        run: php tests/kernel/security_contract_test.php

      - name: Behavior (SQLite CRUD, router, middlewares, email)
        run: php tests/kernel/behavior_test.php

  container-smoke:
    name: Alpine 3.24 / PHP 8.5.12 image
    needs: php-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg PHP_VERSION=8.5.12-fpm-alpine3.24 --tag olivia-framework:quality .

      - name: Assert PHP 8.5.12 on Alpine 3.24
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach olivia-framework:quality)"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          test "$(docker exec "${container_id}" php -r 'echo PHP_VERSION;')" = '8.5.12'
          os_release="$(docker exec "${container_id}" cat /etc/os-release)"
          grep -E '^ID=alpine$' <<<"${os_release}"
          grep -E '^VERSION_ID="?3\.24' <<<"${os_release}"

      - name: Assert required extensions and production php.ini
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for ext in pdo_mysql pdo_sqlite zip fileinfo openssl sodium; do
            if ! docker run --rm olivia-framework:quality php -r "exit(extension_loaded('${ext}') ? 0 : 1);"; then
              echo "::error::missing PHP extension: ${ext}"
              missing=1
            fi
          done
          test "${missing}" -eq 0
          for setting in expose_php display_errors display_startup_errors; do
            test "$(docker run --rm olivia-framework:quality php -r "echo (int) ini_get('${setting}');")" = '0'
          done
          test "$(docker run --rm olivia-framework:quality php -r "echo (int) ini_get('log_errors');")" = '1'
          test "$(docker run --rm olivia-framework:quality php-fpm -i | grep -E '^expose_php ' | awk '{print $3}')" = 'Off'
          if docker run --rm olivia-framework:quality sh -c 'command -v gcc || command -v cc || command -v make'; then
            echo "::error::build toolchain left in final image"
            exit 1
          fi

      - name: Assert no X-Powered-By header
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1:18080:8080 olivia-framework:quality php -S 0.0.0.0:8080 index.php)"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            curl --silent --output /dev/null http://127.0.0.1:18080/ && break
            sleep 0.5
          done
          headers="$(curl --silent --head http://127.0.0.1:18080/)"
          if grep -qi '^x-powered-by:' <<<"${headers}"; then
            echo "::error::X-Powered-By header present"
            exit 1
          fi
